<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking Blastico - Catálogo Musical</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --gold-primary: #D4AF37;
      --gold-soft: #C5A059;
      --gold-hover: #F3D06B;
      --bg-dark: #070708;
      --card-bg: #111113;
      --card-border: rgba(212, 175, 55, 0.22);
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.06) 0%, transparent 60%);
      color: #f5f5f5;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0d0d0f; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.45); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold-primary); }

    .gold-text { color: var(--gold-primary); }
    .gold-gradient-text {
      background: linear-gradient(135deg, #FFFFFF 0%, #E6C770 55%, #B58E3E 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gold-btn {
      background: linear-gradient(135deg, #D4AF37 0%, #9E7B2F 100%);
      color: #09090b;
      font-weight: 700;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.18);
    }
    .gold-btn:hover {
      background: linear-gradient(135deg, #F0CE65 0%, #C59B38 100%);
      transform: translateY(-1.5px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
    }

    .glass-card {
      background: linear-gradient(180deg, rgba(22, 22, 25, 0.92) 0%, rgba(14, 14, 16, 0.96) 100%);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      border-color: rgba(212, 175, 55, 0.55);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7), 0 0 15px rgba(212, 175, 55, 0.08);
    }

    .modal-glass {
      background: rgba(15, 15, 18, 0.94);
      border: 1px solid rgba(212, 175, 55, 0.32);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 30px rgba(212, 175, 55, 0.07);
      backdrop-filter: blur(20px);
    }

    @keyframes modalPopIn {
      0% { opacity: 0; transform: scale(0.94) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes badgePulse {
      0% { transform: scale(0.95); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .animate-modal {
      animation: modalPopIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-card {
      animation: fadeSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .track-row {
      transition: all 0.2s ease;
    }
    .track-row:hover {
      background-color: rgba(255, 255, 255, 0.04);
      border-color: rgba(212, 175, 55, 0.45);
      transform: translateX(3px);
    }
    .score-pill {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
